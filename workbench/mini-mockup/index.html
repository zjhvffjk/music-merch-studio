<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f2"><meta name="description" content="53×45×8mm 透明迷你CD盒样机工作台，上传设计、切换八个视图、导出高清效果图。"><title>Mini CD — 样机工作台</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="Mini CD 样机工作台"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="5"/></svg><span>MINI CD <b>STUDIO</b></span></a><input id="projectName" class="project-name" aria-label="项目名称" value="未命名专辑" maxlength="60"><div class="top-actions"><a id="backToDesign" class="quiet" hidden>返回 2D 设计</a><button id="syncWorkbench" class="quiet" hidden>同步专辑组件</button><button id="loadProject" class="quiet">打开项目</button><button id="saveProject">保存项目</button><button id="exportOpen" class="primary" disabled>导出效果图 <span aria-hidden="true">↗</span></button></div></header>
<main class="workspace">
<aside class="assets-panel"><div class="panel-heading"><h1>设计素材</h1><p>上传图片，即时预览</p></div><div id="assetList" class="asset-list"></div><div class="asset-tools"><button id="demo" class="text-button">试用黑银示例</button><button id="clearAll" class="text-button muted">清空素材</button></div><div class="dimension-note"><strong>53 × 45 × 8 <span>mm</span></strong><p>透明迷你 CD 盒</p><small>主体尺寸 · 高度不含顶部挂孔</small></div></aside>
<section class="preview-panel" aria-label="样机预览"><div class="stage-top"><h2 id="viewTitle">立体内侧</h2><span id="stageNote">原壳结构</span></div><div class="stage" id="stage"><div id="previewPan" class="preview-pan"><div class="canvas-wrap" id="canvasWrap"><canvas id="preview" width="1254" height="1254" aria-label="透明CD盒样机效果图"></canvas><svg id="alignment" viewBox="0 0 1254 1254" aria-label="贴图四角校准"></svg></div></div><div id="loading" class="loading">正在加载透明外壳…</div></div><div class="preview-tools"><button id="zoomOut" aria-label="缩小预览">−</button><button id="zoomReset" aria-label="重置预览缩放">100%</button><button id="zoomIn" aria-label="放大预览">＋</button><button id="emptyToggle" class="compare">查看空壳</button></div><nav id="viewList" class="view-list" aria-label="切换展示角度"></nav><div class="mobile-tabs"><button data-panel="assets">设计素材</button><button data-panel="inspector">素材调整</button></div></section>
<aside class="inspector-panel"><div class="panel-heading"><h2>素材调整</h2><p id="selectedName">封面</p></div><button class="upload-zone" id="uploadSelected"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="2"/><circle cx="12" cy="11" r="2"/><path d="m5 24 8-9 6 6 4-4 5 7"/></svg><span id="uploadLabel">点击上传图片</span><small>PNG / JPG / WebP · 最大 20 MB</small></button><p id="assetHint" class="asset-hint">封面显示在合盒正面及立体外侧</p><div class="control-group"><label>填充方式</label><div class="segmented"><button data-fit="cover" class="active">铺满</button><button data-fit="contain">完整</button></div></div><div id="sliders"></div><div class="adjust-actions"><button id="resetTransform" class="text-button">重置调整</button><button id="removeSelected" class="text-button muted">移除图片</button></div><div class="control-section"><div class="section-title"><h3>显示设置</h3></div><label class="toggle-row">显示设计<input type="checkbox" id="showDesign" checked><span class="switch"></span></label><label class="toggle-row">塑料光影<input type="checkbox" id="lighting" checked><span class="switch"></span></label><label class="toggle-row">盒内圆盘<input type="checkbox" id="discVisible"><span class="switch"></span></label><div class="control-group compact"><label for="background">背景</label><select id="background"><option value="#ffffff">纯白棚拍</option><option value="#f0efec">暖灰棚拍</option><option value="#e8edf0">冷灰棚拍</option></select></div></div><div class="calibrate-section"><button id="calibrate" class="calibrate-button">贴图四角校准</button><p id="calibrateHint">需要微调贴合位置时，拖动贴图四角。</p><button id="resetQuad" class="text-button muted" hidden>恢复当前角度位置</button></div></aside>
</main>
<footer class="statusbar"><span id="saveStatus" role="status">素材仅保存在此浏览器</span><span>九视图照片样机 <i></i><span id="exportStatus">JPEG · 4096 × 4096</span></span></footer>
<input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp" hidden><input id="projectInput" type="file" accept=".json,application/json" hidden>
<dialog id="exportDialog"><form method="dialog"><div class="dialog-heading"><h2>导出效果图</h2><button class="close-button" aria-label="关闭导出窗口">×</button></div><label for="exportMode">导出内容</label><select id="exportMode"><option value="accessories">内外展开组合图</option><option value="current" selected>当前角度</option><option value="sheet">九视图总览（3 × 3 排版）</option></select><p class="dialog-note">输出为 4096 × 4096 高清 JPEG。九视图总览按 3 × 3 排版。</p><button type="button" id="exportConfirm" class="primary full">下载图片</button></form></dialog><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script></body></html>
