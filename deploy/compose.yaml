services:
  studio:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: music-merch-studio:mcp
    container_name: music-merch-studio
    restart: unless-stopped
    init: true
    env_file: /opt/music-merch-studio/secrets.env
    environment:
      STUDIO_PUBLIC_URL: https://music.haoquanwo.cloud
      STUDIO_INTERNAL_URL: http://127.0.0.1:8765
    volumes:
      - /opt/music-merch-studio/outputs:/app/outputs
      - /opt/music-merch-studio/logs:/app/logs
    shm_size: 512mb
    mem_limit: 3g
    cpus: 1.5
    ports:
      - "127.0.0.1:18765:8080"
    networks:
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.routers.music-studio-http.rule: Host(`music.haoquanwo.cloud`)
      traefik.http.routers.music-studio-http.entrypoints: web
      traefik.http.routers.music-studio-http.middlewares: music-studio-https
      traefik.http.middlewares.music-studio-https.redirectscheme.scheme: https
      traefik.http.routers.music-studio.rule: Host(`music.haoquanwo.cloud`)
      traefik.http.routers.music-studio.entrypoints: websecure
      traefik.http.routers.music-studio.tls.certresolver: letsencrypt
      traefik.http.routers.music-studio.service: music-studio
      traefik.http.services.music-studio.loadbalancer.server.port: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 60s
      retries: 3
networks:
  dokploy-network:
    external: true
